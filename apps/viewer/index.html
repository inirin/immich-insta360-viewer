<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Immich Insta360 Viewer</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #050505;
      }

      #status {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 2;
        max-width: min(420px, calc(100vw - 32px));
        padding: 10px 12px;
        color: #ffffff;
        background: rgb(0 0 0 / 72%);
        font: 14px/1.4 system-ui, sans-serif;
      }

      #video {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 1;
        width: min(320px, calc(100vw - 32px));
        max-height: 180px;
        background: #000000;
      }

      #scene {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="status">Preparing viewer...</div>
    <video id="video" playsinline controls style="display:none"></video>
    <canvas id="scene"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
