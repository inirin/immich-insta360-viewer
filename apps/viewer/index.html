<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Immich Insta360 Viewer</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #050505;
      }

      #status {
        position: fixed;
        inset: 0;
        z-index: 3;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        color: #ffffff;
        font: 14px/1.4 system-ui, sans-serif;
        background: rgb(0 0 0 / 42%);
      }

      .status-panel {
        width: min(360px, 100%);
        padding: 24px;
        box-sizing: border-box;
        border: 1px solid rgb(255 255 255 / 14%);
        border-radius: 8px;
        background: rgb(12 12 12 / 88%);
        box-shadow: 0 20px 60px rgb(0 0 0 / 42%);
        text-align: center;
      }

      .status-spinner {
        width: 42px;
        height: 42px;
        margin: 0 auto 18px;
        border: 3px solid rgb(255 255 255 / 18%);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }

      #status-message {
        min-height: 20px;
        margin-bottom: 16px;
        font-size: 15px;
        font-weight: 600;
      }

      .status-progress-track {
        width: 100%;
        height: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: rgb(255 255 255 / 14%);
      }

      #status-progress {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: #6ee7b7;
        transition: width 220ms ease;
      }

      #status-percent {
        margin-top: 10px;
        color: rgb(255 255 255 / 78%);
        font-size: 13px;
      }

      #status[data-progress="unknown"] #status-progress {
        width: 40%;
        animation: progress-indeterminate 1.2s ease-in-out infinite;
      }

      #status[data-state="failed"] {
        background: rgb(0 0 0 / 58%);
      }

      #status[data-state="failed"] .status-spinner {
        display: none;
      }

      #status[data-state="failed"] #status-progress {
        width: 100%;
        background: #f87171;
      }

      #video {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 1;
        width: min(320px, calc(100vw - 32px));
        max-height: 180px;
        background: #000000;
      }

      #scene {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes progress-indeterminate {
        0% {
          transform: translateX(-120%);
        }

        100% {
          transform: translateX(260%);
        }
      }
    </style>
  </head>
  <body>
    <div id="status" data-progress="unknown" role="status" aria-live="polite">
      <div class="status-panel">
        <div class="status-spinner" aria-hidden="true"></div>
        <div id="status-message">Preparing viewer...</div>
        <div class="status-progress-track" aria-hidden="true">
          <div id="status-progress"></div>
        </div>
        <div id="status-percent">Starting...</div>
      </div>
    </div>
    <video id="video" playsinline controls style="display:none"></video>
    <canvas id="scene"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
